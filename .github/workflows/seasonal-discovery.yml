name: Refresh seasonal anime coverage report

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/seasonal_discovery.py"
      - ".github/workflows/seasonal-discovery.yml"

permissions:
  contents: write

concurrency:
  group: seasonal-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Discover current and upcoming seasons
        run: python tools/seasonal_discovery.py
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_seasonal_discovery.py' -v
      - name: Commit report when changed
        run: |
          if [ -z "$(git status --porcelain -- data/seasonal_discovery_report.json)" ]; then
            echo "Seasonal discovery report is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seasonal_discovery_report.json
          git commit -m "chore: refresh seasonal anime coverage report"
          git push
