name: Refresh seasonal anime coverage report

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "tools/seasonal_discovery.py"
      - "tests/test_seasonal_discovery.py"
      - "data/archive_manifest.json"
      - "data/archive_candidates.json"
      - "data/subsplease_release_report.json"
      - "tools/october_episode_coverage.py"
      - ".github/workflows/seasonal-discovery.yml"

permissions:
  contents: write

concurrency:
  group: seasonal-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Discover current and upcoming seasons
        run: python tools/seasonal_discovery.py
      - name: Build October episode coverage report
        run: python tools/october_episode_coverage.py
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit report when changed
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain -- data/seasonal_discovery_report.json data/october_episode_coverage_report.json)" ]; then
            echo "Seasonal discovery report is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seasonal_discovery_report.json data/october_episode_coverage_report.json
          git commit -m "chore: refresh seasonal and October episode coverage reports"

          # Other workflows may update main while this report is being built.
          # Rebase this report commit onto the latest main and retry a normal
          # fast-forward push; never force-push or overwrite concurrent changes.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main update (attempt ${attempt}/5); retrying."
            sleep $((attempt * 2))
          done
          echo "Unable to publish coverage reports after 5 safe retries." >&2
          exit 1
