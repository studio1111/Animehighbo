name: Animehighbo publisher

on:
  repository_dispatch:
    types: [animehighbo-episode-prepared]
  workflow_run:
    workflows:
      - Animehighbo episode preparation
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish every complete prepared episode independently
    if: ${{ github.event_name == 'repository_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: animehighbo-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check whether the completed preparation run has any artifacts
        id: artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.eventName === 'repository_dispatch'
              ? Number(context.payload.client_payload.run_id)
              : context.payload.workflow_run.id;
            const result = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100
            });
            const available = result.data.artifacts.filter(item => !item.expired);
            const identity = context.eventName === 'repository_dispatch'
              ? String(context.payload.client_payload.identity || '')
              : '';
            const selected = identity
              ? available.filter(item => item.name === `episode-${identity}`)
              : available;
            core.setOutput('run_id', String(runId));
            core.setOutput('pattern', identity ? `episode-${identity}` : 'episode-*');
            core.setOutput('available', String(selected.length > 0));
            core.info(`Prepared artifacts selected: ${selected.length}`);
      - name: Download artifacts from the exact preparation run
        id: download
        if: steps.artifacts.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifacts.outputs.run_id }}
          pattern: ${{ steps.artifacts.outputs.pattern }}
          path: prepared-artifacts
          merge-multiple: false
      - name: Configure Telegram API endpoint
        if: steps.download.outcome == 'success'
        env:
          TELEGRAM_LOCAL_API_SECRET: ${{ secrets.TELEGRAM_LOCAL_API }}
          TELEGRAM_LOCAL_API_VAR: ${{ vars.TELEGRAM_LOCAL_API }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_BASE_URL: ${{ vars.TELEGRAM_API_BASE_URL }}
        run: |
          if [ -n "$TELEGRAM_LOCAL_API_SECRET" ]; then
            TELEGRAM_LOCAL_API="$TELEGRAM_LOCAL_API_SECRET"
          elif [ -n "$TELEGRAM_LOCAL_API_VAR" ]; then
            TELEGRAM_LOCAL_API="$TELEGRAM_LOCAL_API_VAR"
          else
            TELEGRAM_LOCAL_API="false"
          fi
          if [ "${TELEGRAM_LOCAL_API,,}" = "true" ]; then
            if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
              echo "TELEGRAM_LOCAL_API=true requires TELEGRAM_API_ID, TELEGRAM_API_HASH, and TELEGRAM_BOT_TOKEN secrets."
              exit 1
            fi
            docker run --pull always --detach --name animehighbo-local-bot-api \
              --publish 127.0.0.1:8081:8081 \
              --env TELEGRAM_API_ID="$TELEGRAM_API_ID" \
              --env TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
              --env TELEGRAM_LOCAL=1 \
              aiogram/telegram-bot-api:latest
            ready=false
            for attempt in $(seq 1 60); do
              if curl --silent --show-error --fail "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/getMe" >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != "true" ]; then
              docker logs animehighbo-local-bot-api || true
              echo "Local Telegram Bot API did not become ready."
              exit 1
            fi
            echo "TELEGRAM_API_BASE_URL=http://127.0.0.1:8081" >> "$GITHUB_ENV"
          elif [ -n "$TELEGRAM_API_BASE_URL" ]; then
            echo "TELEGRAM_API_BASE_URL=$TELEGRAM_API_BASE_URL" >> "$GITHUB_ENV"
          fi
      - name: Publish complete prepared episodes only
        if: steps.download.outcome == 'success'
        env:
          ANIMEHIGHBO_PUBLISH_PREPARED: 'true'
          ANIMEHIGHBO_PREPARED_DIR: prepared-artifacts
          ANIMEHIGHBO_PUBLISH_EVENTS_FILE: publish-events.json
          ANIMEHIGHBO_DRY_RUN_SECRET: ${{ secrets.ANIMEHIGHBO_DRY_RUN }}
          ANIMEHIGHBO_DRY_RUN_VAR: ${{ vars.ANIMEHIGHBO_DRY_RUN }}
          ANIMEHIGHBO_MAX_FILE_SIZE_MB_SECRET: ${{ secrets.ANIMEHIGHBO_MAX_FILE_SIZE_MB }}
          ANIMEHIGHBO_MAX_FILE_SIZE_MB_VAR: ${{ vars.ANIMEHIGHBO_MAX_FILE_SIZE_MB }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$ANIMEHIGHBO_DRY_RUN_SECRET" ]; then
            export ANIMEHIGHBO_DRY_RUN="$ANIMEHIGHBO_DRY_RUN_SECRET"
            dry_run_source="repository secret"
          elif [ -n "$ANIMEHIGHBO_DRY_RUN_VAR" ]; then
            export ANIMEHIGHBO_DRY_RUN="$ANIMEHIGHBO_DRY_RUN_VAR"
            dry_run_source="repository variable"
          else
            export ANIMEHIGHBO_DRY_RUN="$(python -c 'import json; print(str(json.load(open("config.json", encoding="utf-8")).get("dry_run", True)).lower())')"
            dry_run_source="config.json"
          fi
          case "${ANIMEHIGHBO_DRY_RUN,,}" in
            false|0|no|off) dry_run_state="disabled" ;;
            *) dry_run_state="enabled" ;;
          esac
          echo "Publisher dry-run state: $dry_run_state"
          echo "Publisher dry-run setting source: $dry_run_source"
          if [ -n "$ANIMEHIGHBO_MAX_FILE_SIZE_MB_SECRET" ]; then
            export ANIMEHIGHBO_MAX_FILE_SIZE_MB="$ANIMEHIGHBO_MAX_FILE_SIZE_MB_SECRET"
          elif [ -n "$ANIMEHIGHBO_MAX_FILE_SIZE_MB_VAR" ]; then
            export ANIMEHIGHBO_MAX_FILE_SIZE_MB="$ANIMEHIGHBO_MAX_FILE_SIZE_MB_VAR"
          else
            export ANIMEHIGHBO_MAX_FILE_SIZE_MB=1800
          fi
          echo "Prepared episode manifests: $(find prepared-artifacts -name manifest.json | wc -l)"
          python app.py
      - name: Persist duplicate-prevention state
        id: persist
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/state.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            git commit -m "chore: update Animehighbo publication state [skip ci]"
            git fetch origin main
            git rebase origin/main
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Publication state persisted to main."
                echo "persisted=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Push attempt $attempt was rejected; refreshing main before retry."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "State persistence has a merge conflict; refusing to overwrite newer state."
                exit 1
              fi
              sleep 2
            done
            echo "Could not persist publication state after three attempts."
            exit 1
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "persisted=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Queue the next eligible episode for each affected series
        if: steps.persist.outputs.persisted == 'true' && steps.persist.outputs.changed == 'true' && hashFiles('publish-events.json') != ''
        uses: actions/github-script@v7
        env:
          PUBLISH_EVENTS_FILE: publish-events.json
        with:
          github-token: ${{ secrets.GH_WORKFLOW_TOKEN }}
          script: |
            const fs = require('fs');
            const keys = JSON.parse(fs.readFileSync(process.env.PUBLISH_EVENTS_FILE, 'utf8'));
            for (const series_key of [...new Set(keys.filter(key => typeof key === 'string' && key.trim()))]) {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'animehighbo-episode-published',
                client_payload: { series_key }
              });
              core.info(`Queued the next eligible episode for ${series_key}.`);
            }
