name: Animehighbo publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'config.json'
      - 'data/archive_manifest.json'
      - 'tools/episode_queue.py'
      - 'tools/torrent_downloader.py'
      - 'tools/video_encoder.py'
      - '.github/workflows/publish.yml'
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: animehighbo-publisher
  cancel-in-progress: false

jobs:
  queue:
    name: Select lowest incomplete episode tier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_work: ${{ steps.plan.outputs.has_work }}
      episode_tier: ${{ steps.plan.outputs.episode_tier }}
      batch_key: ${{ steps.plan.outputs.batch_key }}
      matrix: ${{ steps.plan.outputs.matrix }}
      source_ref: ${{ steps.revision.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin queue planning to the latest main snapshot
        run: |
          git fetch origin main
          git checkout --detach origin/main
      - name: Record the exact source revision for every worker
        id: revision
        run: echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Plan the lowest incomplete episode tier
        id: plan
        run: python tools/episode_queue.py --github-output "$GITHUB_OUTPUT"
      - name: Report planned batch
        env:
          HAS_WORK: ${{ steps.plan.outputs.has_work }}
          EPISODE_TIER: ${{ steps.plan.outputs.episode_tier }}
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: |
          echo "Work available: $HAS_WORK"
          echo "Lowest incomplete episode tier: $EPISODE_TIER"
          python - <<'PY'
          import json, os
          matrix = json.loads(os.environ["MATRIX"])
          print(f"Independent episode workers selected: {len(matrix.get('include', []))}")
          PY

  prepare:
    name: Prepare ${{ matrix.title }}
    needs: queue
    if: needs.queue.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.queue.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.queue.outputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg fonts-noto-core
      - name: Install offline subtitle fallback when Gemini keys are unavailable
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GEMINI_API_KEY_1" ] && [ -z "$GEMINI_API_KEY_2" ] && [ -z "$GEMINI_API_KEY_3" ] && [ -z "$GEMINI_API_KEY_4" ]; then
            pip install -r requirements-subtitles.txt
          fi
      - name: Prepare one episode and all three validated qualities
        env:
          ANIMEHIGHBO_EPISODE_ID: ${{ matrix.identity }}
          ANIMEHIGHBO_PREPARE_ONLY: 'true'
          ANIMEHIGHBO_DRY_RUN: 'false'
          ANIMEHIGHBO_MAX_FILE_SIZE_MB: ${{ secrets.ANIMEHIGHBO_MAX_FILE_SIZE_MB || vars.ANIMEHIGHBO_MAX_FILE_SIZE_MB || '1800' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: python app.py
      - name: Upload this episode's prepared files
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ matrix.identity }}
          path: prepared/${{ matrix.identity }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the completed episode tier in order
    needs: [queue, prepare]
    if: needs.queue.outputs.has_work == 'true' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.queue.outputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Download all prepared episode artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: episode-*
          path: prepared-artifacts
          merge-multiple: false
      - name: Configure Telegram API endpoint
        env:
          TELEGRAM_LOCAL_API_SECRET: ${{ secrets.TELEGRAM_LOCAL_API }}
          TELEGRAM_LOCAL_API_VAR: ${{ vars.TELEGRAM_LOCAL_API }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_BASE_URL: ${{ vars.TELEGRAM_API_BASE_URL }}
        run: |
          if [ -n "$TELEGRAM_LOCAL_API_SECRET" ]; then
            TELEGRAM_LOCAL_API="$TELEGRAM_LOCAL_API_SECRET"
          elif [ -n "$TELEGRAM_LOCAL_API_VAR" ]; then
            TELEGRAM_LOCAL_API="$TELEGRAM_LOCAL_API_VAR"
          else
            TELEGRAM_LOCAL_API="false"
          fi
          needs_file_api=true
          if [ "${TELEGRAM_LOCAL_API,,}" = "true" ] && [ "$needs_file_api" = "true" ]; then
            if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
              echo "TELEGRAM_LOCAL_API=true requires TELEGRAM_API_ID, TELEGRAM_API_HASH, and TELEGRAM_BOT_TOKEN secrets."
              exit 1
            fi
            docker run --pull always --detach --name animehighbo-local-bot-api \
              --publish 127.0.0.1:8081:8081 \
              --env TELEGRAM_API_ID="$TELEGRAM_API_ID" \
              --env TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
              --env TELEGRAM_LOCAL=1 \
              aiogram/telegram-bot-api:latest
            ready=false
            for attempt in $(seq 1 60); do
              if curl --silent --show-error --fail "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/getMe" >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != "true" ]; then
              docker logs animehighbo-local-bot-api || true
              echo "Local Telegram Bot API did not become ready."
              exit 1
            fi
            echo "TELEGRAM_API_BASE_URL=http://127.0.0.1:8081" >> "$GITHUB_ENV"
          elif [ -n "$TELEGRAM_API_BASE_URL" ]; then
            echo "TELEGRAM_API_BASE_URL=$TELEGRAM_API_BASE_URL" >> "$GITHUB_ENV"
          fi
      - name: Publish posters and replies for this episode tier in release-date order
        env:
          ANIMEHIGHBO_PUBLISH_PREPARED: 'true'
          ANIMEHIGHBO_PREPARED_DIR: prepared-artifacts
          ANIMEHIGHBO_EPISODE_TIER: ${{ needs.queue.outputs.episode_tier }}
          ANIMEHIGHBO_DRY_RUN_SECRET: ${{ secrets.ANIMEHIGHBO_DRY_RUN }}
          ANIMEHIGHBO_DRY_RUN_VAR: ${{ vars.ANIMEHIGHBO_DRY_RUN }}
          ANIMEHIGHBO_MAX_FILE_SIZE_MB_SECRET: ${{ secrets.ANIMEHIGHBO_MAX_FILE_SIZE_MB }}
          ANIMEHIGHBO_MAX_FILE_SIZE_MB_VAR: ${{ vars.ANIMEHIGHBO_MAX_FILE_SIZE_MB }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$ANIMEHIGHBO_DRY_RUN_SECRET" ]; then
            export ANIMEHIGHBO_DRY_RUN="$ANIMEHIGHBO_DRY_RUN_SECRET"
            dry_run_source="repository secret"
          elif [ -n "$ANIMEHIGHBO_DRY_RUN_VAR" ]; then
            export ANIMEHIGHBO_DRY_RUN="$ANIMEHIGHBO_DRY_RUN_VAR"
            dry_run_source="repository variable"
          else
            export ANIMEHIGHBO_DRY_RUN="$(python -c 'import json; print(str(json.load(open("config.json", encoding="utf-8")).get("dry_run", True)).lower())')"
            dry_run_source="config.json"
          fi
          case "${ANIMEHIGHBO_DRY_RUN,,}" in
            false|0|no|off) dry_run_state="disabled" ;;
            *) dry_run_state="enabled" ;;
          esac
          echo "Publisher dry-run state: $dry_run_state"
          echo "Publisher dry-run setting source: $dry_run_source"
          if [ -n "$ANIMEHIGHBO_MAX_FILE_SIZE_MB_SECRET" ]; then
            export ANIMEHIGHBO_MAX_FILE_SIZE_MB="$ANIMEHIGHBO_MAX_FILE_SIZE_MB_SECRET"
          elif [ -n "$ANIMEHIGHBO_MAX_FILE_SIZE_MB_VAR" ]; then
            export ANIMEHIGHBO_MAX_FILE_SIZE_MB="$ANIMEHIGHBO_MAX_FILE_SIZE_MB_VAR"
          else
            export ANIMEHIGHBO_MAX_FILE_SIZE_MB=1800
          fi
          echo "Publishing episode tier: $ANIMEHIGHBO_EPISODE_TIER"
          echo "Prepared episode artifacts: $(find prepared-artifacts -name manifest.json | wc -l)"
          python app.py
      - name: Persist duplicate-prevention state
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            git commit -m "chore: update Animehighbo publication state [skip ci]"
            git fetch origin main
            git rebase origin/main
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Publication state persisted to main."
                exit 0
              fi
              echo "Push attempt $attempt was rejected; refreshing main before retry."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "State persistence has a merge conflict; refusing to overwrite newer state."
                exit 1
              fi
              sleep 2
            done
            echo "Could not persist publication state after three attempts."
            exit 1
          fi
