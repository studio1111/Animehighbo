name: Animehighbo publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'config.json'
      - '.github/workflows/publish.yml'
      - 'tools/torrent_downloader.py'
      - 'tools/bilingual_subtitles.py'
      - 'tools/video_encoder.py'
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: animehighbo-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Detect configured media sources
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from app import has_file_media_source
          with open("config.json", encoding="utf-8") as stream:
              config = json.load(stream)
          file_pipeline = config.get("mode") != "links" and has_file_media_source(config)
          needs_media_tools = file_pipeline and any(
              config.get(name, False)
              for name in ("bilingual_subtitles", "encode_h265", "burn_persian_subtitles")
          )
          needs_subtitle_fallback = (
              file_pipeline and bool(config.get("bilingual_subtitles", False))
          )
          print(f"ANIMEHIGHBO_FILE_PIPELINE={str(file_pipeline).lower()}")
          print(f"ANIMEHIGHBO_NEEDS_MEDIA_TOOLS={str(needs_media_tools).lower()}")
          print(f"ANIMEHIGHBO_NEEDS_SUBTITLE_FALLBACK={str(needs_subtitle_fallback).lower()}")
          PY
      - name: Install aria2 for explicitly authorized torrent sources
        run: |
          if python -c 'import json,sys; c=json.load(open("config.json", encoding="utf-8")); sys.exit(0 if any(isinstance(x,dict) and x.get("authorized_for_redistribution") is True for x in c.get("torrent_sources", [])) else 1)'; then
            sudo apt-get update
            sudo apt-get install -y aria2
          fi
      - name: Install optional media processing tools
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "$ANIMEHIGHBO_NEEDS_MEDIA_TOOLS" = "true" ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-noto-core
          fi
          if [ -z "$GEMINI_API_KEY" ] && [ "$ANIMEHIGHBO_NEEDS_SUBTITLE_FALLBACK" = "true" ]; then
            pip install -r requirements-subtitles.txt
          fi
      - name: Configure Telegram API endpoint
        env:
          TELEGRAM_LOCAL_API: ${{ secrets.TELEGRAM_LOCAL_API || vars.TELEGRAM_LOCAL_API }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_BASE_URL: ${{ vars.TELEGRAM_API_BASE_URL }}
        run: |
          needs_file_api=false
          if [ "$ANIMEHIGHBO_FILE_PIPELINE" = "true" ]; then
            needs_file_api=true
          fi
          if [ "${TELEGRAM_LOCAL_API,,}" = "true" ] && [ "$needs_file_api" = "true" ]; then
            if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
              echo "TELEGRAM_LOCAL_API=true requires TELEGRAM_API_ID and TELEGRAM_API_HASH secrets plus TELEGRAM_BOT_TOKEN."
              exit 1
            fi
            docker run --pull always --detach --name animehighbo-local-bot-api \
              --publish 127.0.0.1:8081:8081 \
              --env TELEGRAM_API_ID="$TELEGRAM_API_ID" \
              --env TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
              --env TELEGRAM_LOCAL=1 \
              aiogram/telegram-bot-api:latest
            ready=false
            for attempt in $(seq 1 60); do
              if curl --silent --show-error --fail \
                "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/getMe" >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != "true" ]; then
              docker logs animehighbo-local-bot-api || true
              echo "Local Telegram Bot API did not become ready."
              exit 1
            fi
            echo "TELEGRAM_API_BASE_URL=http://127.0.0.1:8081" >> "$GITHUB_ENV"
          elif [ -n "$TELEGRAM_API_BASE_URL" ]; then
            echo "TELEGRAM_API_BASE_URL=$TELEGRAM_API_BASE_URL" >> "$GITHUB_ENV"
          fi
      - name: Run publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANIMEHIGHBO_DRY_RUN: ${{ secrets.ANIMEHIGHBO_DRY_RUN || vars.ANIMEHIGHBO_DRY_RUN || 'true' }}
          ANIMEHIGHBO_MAX_FILE_SIZE_MB: ${{ secrets.ANIMEHIGHBO_MAX_FILE_SIZE_MB || vars.ANIMEHIGHBO_MAX_FILE_SIZE_MB }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: python app.py
      - name: Persist duplicate-prevention state
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            git commit -m "chore: update Animehighbo publication state [skip ci]"
            git push
          fi
