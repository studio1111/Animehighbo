name: Pause publishers before global ordering fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-run.yml'
permissions:
  actions: write
  contents: read
jobs:
  stop-unordered-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only verified runs that predate the global publisher lock
        uses: actions/github-script@v7
        with:
          script: |
            const targets = [
              { id: 39590502657, sha: "269de1c2840f4e94f1f21aa2bc024c0f55e6741b" },
              { id: 39591003180, sha: "9c1033c71d429d89c2d09a7ae8d2c141e0c1270c" }
            ];
            for (const target of targets) {
              const result = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: target.id
              });
              const run = result.data;
              core.info(`Verified run ${run.id}: ${run.name}, status=${run.status}, SHA=${run.head_sha}`);
              if (run.name !== "Animehighbo episode dispatcher" || run.head_sha !== target.sha) {
                core.setFailed(`Identity mismatch for run ${target.id}; refusing to cancel it.`);
                continue;
              }
              if (["queued", "in_progress", "pending", "waiting"].includes(run.status)) {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: target.id
                });
                core.info(`Cancellation requested for run ${target.id}.`);
              } else {
                core.info(`Run ${target.id} is already terminal.`);
              }
            }
