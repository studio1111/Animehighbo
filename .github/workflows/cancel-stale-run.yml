name: Stop stale Animehighbo dispatcher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-run.yml'
permissions:
  actions: write
  contents: read
jobs:
  stop-stale-run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the verified outdated dispatcher
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 39586006720;
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            core.info(`Verified target run ${run.data.id}: ${run.data.name}, status=${run.data.status}, SHA=${run.data.head_sha}`);
            if (run.data.name !== "Animehighbo episode dispatcher" || run.data.head_sha !== "feadcbd850216d1a9fab661de7580d918348a709cd119099b024842eb16b97a5".slice(0, 40)) {
              core.setFailed("Target identity did not match the known outdated dispatcher; refusing to cancel.");
            } else if (["queued", "in_progress", "pending", "waiting"].includes(run.data.status)) {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId
              });
              core.info("Cancellation requested for the outdated run; no new run was started by this step.");
            } else {
              core.info("Target run is already terminal; no cancellation needed.");
            }
