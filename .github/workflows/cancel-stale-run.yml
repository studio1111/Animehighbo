name: Stop outdated Gemini burst
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-run.yml'
permissions:
  actions: write
  contents: read
jobs:
  stop-outdated-run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the verified outdated quota-burst run
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 39587251574;
            const expectedSha = "54825920e9a9301a96c9a85cd3a02017c36cddbb";
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            core.info(`Verified target run ${run.data.id}: ${run.data.name}, status=${run.data.status}, SHA=${run.data.head_sha}`);
            if (run.data.name !== "Animehighbo episode dispatcher" || run.data.head_sha !== expectedSha) {
              core.setFailed("Target identity did not match the verified outdated run; refusing to cancel.");
            } else if (["queued", "in_progress", "pending", "waiting"].includes(run.data.status)) {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId
              });
              core.info("Cancellation requested for the outdated quota-burst run.");
            } else {
              core.info("Target run is already terminal; no cancellation needed.");
            }
