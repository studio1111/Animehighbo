name: Monitor SubsPlease release metadata coverage

on:
  schedule:
    # Offset the RSS coverage check by 15 minutes to detect gaps between catalog scans.
    - cron: "15,45 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/subsplease_release_monitor.py"
      - "tools/notify_new_releases.py"
      - "tests/test_notify_new_releases.py"
      - "tests/test_subsplease_release_monitor.py"
      - ".github/workflows/subsplease-release-monitor.yml"
      - "data/archive_manifest.json"
      - "data/archive_candidates.json"
      - "config.json"

permissions:
  actions: write
  contents: write

concurrency:
  group: subsplease-release-metadata-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run metadata monitor and notification regression tests
        run: |
          python -m unittest discover -s tests -p 'test_subsplease_release_monitor.py' -v
          python -m unittest discover -s tests -p 'test_notify_new_releases.py' -v
      - name: Preserve previous release report for change detection
        run: |
          if [ -f data/subsplease_release_report.json ]; then
            cp data/subsplease_release_report.json /tmp/subsplease_release_report.previous.json
          else
            printf '{"releases": []}\n' > /tmp/subsplease_release_report.previous.json
          fi
      - name: Refresh release coverage report
        run: python tools/subsplease_release_monitor.py
      # The RSS monitor is a safety net for any release the catalog scan missed.
      # Scheduled and push-triggered checks may request a catalog rebuild, but
      # workflow_dispatch checks are excluded to prevent a refresh loop.
      - name: Rebuild archive catalog when scheduled RSS check finds gaps
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          report_path = Path("data/subsplease_release_report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          summary = report.get("summary", {})
          missing = int(summary.get("missing_from_manifest", 0))
          if missing <= 0:
              print("RSS coverage matches the archive manifest; no rebuild is needed.")
              raise SystemExit(0)

          print(
              f"RSS coverage found {missing} release(s) missing from the archive manifest; "
              "requesting an immediate catalog refresh."
          )
          subprocess.run(
              [
                  "gh", "workflow", "run", "build-archive-catalog.yml",
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--ref", "main",
              ],
              check=True,
          )
          print("Catalog refresh requested; its completion triggers the episode dispatcher.")
          PY
      - name: Notify Telegram about newly detected release metadata
        env:
          TELEGRAM_ALERT_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: python tools/notify_new_releases.py --previous /tmp/subsplease_release_report.previous.json --current data/subsplease_release_report.json
      - name: Commit report when changed
        run: |
          if [ -z "$(git status --porcelain -- data/subsplease_release_report.json)" ]; then
            echo "Release coverage report is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/subsplease_release_report.json
          git commit -m "chore: refresh SubsPlease release metadata report"
          # Catalog refreshes and other automation may push to main at the same
          # time. Rebase the report commit instead of failing on a non-fast-forward.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
