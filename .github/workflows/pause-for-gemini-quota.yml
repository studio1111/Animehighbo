name: Pause Animehighbot until Gemini quota reset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pause-for-gemini-quota.yml'
permissions:
  actions: write
  contents: read
jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify and cancel workers during confirmed daily quota cooldown
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 39604074045;
            const expectedSha = "4afc7610ebc3acdd4634ac35f31eedc2f469317c";
            const result = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            const run = result.data;
            core.info(`Verified run ${run.id}: ${run.name}, status=${run.status}, SHA=${run.head_sha}`);
            if (run.name !== "Animehighbo episode dispatcher" || run.head_sha !== expectedSha) {
              core.setFailed("Run identity mismatch; refusing cancellation.");
              return;
            }
            if (["queued", "in_progress", "pending", "waiting"].includes(run.status)) {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId
              });
              core.info("Cancellation requested; queue cooldown prevents further quota-wasting retries until reset.");
            } else {
              core.info("Run already terminal; no cancellation needed.");
            }
