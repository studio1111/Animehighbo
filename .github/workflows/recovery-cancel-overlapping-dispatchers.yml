name: One-time Animehighbo dispatcher recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-cancel-overlapping-dispatchers.yml'

permissions:
  actions: write

jobs:
  cancel-overlapping-dispatchers:
    if: github.event.head_commit.message == 'recovery: cancel overlapping dispatchers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // These two runs were selected before strict upload-date grouping was fixed.
            // Neither has posted a new episode yet, as verified in data/state.json.
            const runIds = [39785534100, 39786030685];
            for (const run_id of runIds) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                core.info(`Cancellation requested for workflow run ${run_id}`);
              } catch (error) {
                if (error.status === 404 || error.status === 409) {
                  core.info(`Workflow run ${run_id} is already terminal (${error.status})`);
                } else {
                  throw error;
                }
              }
            }
