name: Recover stalled Animehighbot dispatcher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-stalled-dispatcher.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel-stalled-dispatcher:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify stale run identity before cancellation
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 39597928245;
            const expectedSha = "f827293825ff2785704024e8426cc6cc8c5730b2";
            const result = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            const run = result.data;
            core.info(`Verified run ${run.id}: ${run.name}, status=${run.status}, SHA=${run.head_sha}`);
            if (run.name !== "Animehighbo episode dispatcher" || run.head_sha !== expectedSha) {
              core.setFailed("Run identity mismatch; refusing cancellation.");
              return;
            }
            if (["queued", "in_progress", "pending", "waiting"].includes(run.status)) {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId
              });
              core.info("Cancellation requested for the verified dispatcher pinned to the exhausted Gemini model, freeing the dispatcher concurrency lock.");
            } else {
              core.info("Run is already terminal; no cancellation needed.");
            }
