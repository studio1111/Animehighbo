name: SubsPlease release monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: subsplease-release-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check SubsPlease release titles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBSPLEASE_DRY_RUN: ${{ vars.SUBSPLEASE_DRY_RUN }}
        run: python tools/subsplease_monitor.py
      - name: Persist monitor state
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/subsplease_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/subsplease_state.json
            git commit -m "chore: update SubsPlease monitor state [skip ci]"
            git push
          fi
