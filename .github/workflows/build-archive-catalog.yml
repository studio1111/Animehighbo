name: Discover archive candidates (metadata only)

on:
  push:
    branches: [main]
    paths:
      - 'tools/archive_catalog.py'
      - '.github/workflows/build-archive-catalog.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest episode release date to include (YYYY-MM-DD)"
        required: true
        default: "2026-10-01"
        type: string
      max_pages:
        description: "Maximum SubsPlease release pages to inspect for eligible anime"
        required: true
        default: "100"
        type: string

permissions:
  contents: write

concurrency:
  group: archive-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Generate metadata-only archive candidates
        env:
          ARCHIVE_SINCE: ${{ inputs.since || '2026-10-01' }}
          ARCHIVE_MAX_PAGES: ${{ inputs.max_pages || '100' }}
          ARCHIVE_MAX_FILE_SIZE_MB: ${{ secrets.ANIMEHIGHBO_MAX_FILE_SIZE_MB || vars.ANIMEHIGHBO_MAX_FILE_SIZE_MB || '1800' }}
        run: |
          python tools/archive_catalog.py \
            --since "$ARCHIVE_SINCE" \
            --max-pages "$ARCHIVE_MAX_PAGES" \
            --max-file-size-mb "$ARCHIVE_MAX_FILE_SIZE_MB" \
            --output data/archive_candidates.json
      - name: Validate candidates and run tests
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q app.py tools tests
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("data/archive_candidates.json").read_text(encoding="utf-8"))
          if not isinstance(rows, list) or not rows:
              raise SystemExit("Candidate file is empty or invalid.")
          if any(
              row.get("authorized_for_redistribution") is not False
              or row.get("review_required") is not True
              for row in rows
          ):
              raise SystemExit("Discovered candidates must remain unapproved until rights are reviewed.")
          if any(not row.get("release_date") for row in rows):
              raise SystemExit("Candidate contains an entry without its source upload date.")
          ordered = [row["release_date"] for row in rows]
          if ordered != sorted(ordered):
              raise SystemExit("Candidate list is not globally sorted by source upload date.")
          print(f"Validated {len(rows)} date-ordered review candidates; none is authorized for publication.")
          PY
      - name: Upload candidate report for inspection
        uses: actions/upload-artifact@v4
        with:
          name: animehighbo-archive-candidates
          path: data/archive_candidates.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated candidate report to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # git diff does not see an untracked first-run report; use status so
          # the initial generated candidate file is committed as well.
          if [ -z "$(git status --porcelain -- data/archive_candidates.json)" ]; then
            echo "Candidate report is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive_candidates.json
          git commit -m "data: refresh archive discovery candidates"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:${GITHUB_REF_NAME}"
