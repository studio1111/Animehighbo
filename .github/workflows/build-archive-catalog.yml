name: Refresh complete archive manifest

on:
  push:
    branches: [main]
    paths:
      - 'tools/archive_catalog.py'
      - '.github/workflows/build-archive-catalog.yml'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest episode release date to include (YYYY-MM-DD)"
        required: true
        default: "2026-10-01"
        type: string
      max_pages:
        description: "Maximum SubsPlease release pages to inspect for eligible anime"
        required: true
        default: "100"
        type: string

permissions:
  contents: write

concurrency:
  group: archive-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Build full SubsPlease archive manifest
        env:
          ARCHIVE_SINCE: ${{ inputs.since || '2026-10-01' }}
          ARCHIVE_MAX_PAGES: ${{ inputs.max_pages || '100' }}
          ARCHIVE_MAX_FILE_SIZE_MB: ${{ secrets.ANIMEHIGHBO_MAX_FILE_SIZE_MB || vars.ANIMEHIGHBO_MAX_FILE_SIZE_MB || '1800' }}
        run: |
          python tools/archive_catalog.py \
            --since "$ARCHIVE_SINCE" \
            --max-pages "$ARCHIVE_MAX_PAGES" \
            --max-file-size-mb "$ARCHIVE_MAX_FILE_SIZE_MB" \
            --output data/archive_manifest.json
      - name: Validate archive manifest and run tests
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q app.py tools tests
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          rows = json.loads(Path("data/archive_manifest.json").read_text(encoding="utf-8"))
          if not isinstance(rows, list) or not rows:
              raise SystemExit("Archive manifest is empty or invalid.")
          for row in rows:
              if not isinstance(row, dict):
                  raise SystemExit("Archive manifest contains a non-object row.")
              if not row.get("title") or not row.get("uri") or not row.get("release_date"):
                  raise SystemExit("Archive manifest row is missing title, source URI, or release date.")
              if not row.get("episode"):
                  raise SystemExit("Archive manifest row is missing episode number.")
              if not str(row["uri"]).startswith(("magnet:", "https://")):
                  raise SystemExit("Archive manifest contains an unsupported source URI.")
          dates = [row["release_date"] for row in rows]
          if dates != sorted(dates):
              raise SystemExit("Archive manifest is not sorted by release date.")
          print(f"Validated {len(rows)} ordered archive entries with source URIs.")
          PY
      - name: Upload refreshed archive manifest
        uses: actions/upload-artifact@v4
        with:
          name: animehighbo-archive-manifest
          path: data/archive_manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit refreshed archive manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Include the complete generated archive manifest when it changes.
          if [ -z "$(git status --porcelain -- data/archive_manifest.json)" ]; then
            echo "Archive manifest is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive_manifest.json
          git commit -m "data: refresh complete archive manifest"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:${GITHUB_REF_NAME}"
