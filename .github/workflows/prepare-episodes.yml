name: Animehighbo episode dispatcher

on:
  workflow_dispatch:
    inputs:
      completed_identity:
        description: Episode worker that has finished and released a queue slot
        required: false
        default: ''
        type: string
      completed_conclusion:
        description: Outcome of the worker that just finished
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'config.json'
      - 'data/archive_manifest.json'
      - 'data/archive_exclusions.json'
      - 'data/state.json'
      - 'tools/episode_queue.py'
      - 'tools/bilingual_subtitles.py'
      - 'tools/torrent_downloader.py'
      - 'tools/video_encoder.py'
      - '.github/workflows/prepare-episodes.yml'
      - '.github/workflows/prepare-one-episode.yml'
  schedule:
    - cron: '*/5 * * * *'
  # Reconcile newly committed catalog and manual-exclusion changes promptly.
  # Refill worker slots whenever an episode worker finishes, including failures,
  # so queued episodes do not wait for the next five-minute poll.
  workflow_run:
    workflows: ["Animehighbo single-episode worker"]
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: animehighbo-episode-dispatcher-planner-v2
  cancel-in-progress: false

jobs:
  queue:
    name: Select up to five episodes for parallel preparation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_work: ${{ steps.plan.outputs.has_work }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Exclude episodes already queued or running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMPLETED_IDENTITY: ${{ inputs.completed_identity || '' }}
          COMPLETED_CONCLUSION: ${{ inputs.completed_conclusion || github.event.workflow_run.conclusion || '' }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          prefix = "Animehighbo worker "
          active = set()
          recent_failed = set()
          now = datetime.now(timezone.utc)
          cooldown = timedelta(minutes=15)

          for status in ("queued", "in_progress"):
            result = subprocess.run(
              ["gh", "api", f"repos/{repo}/actions/workflows/prepare-one-episode.yml/runs?status={status}&per_page=100"],
              check=True, capture_output=True, text=True,
            )
            for run in json.loads(result.stdout).get("workflow_runs", []):
              title = str(run.get("display_title") or "")
              if title.startswith(prefix):
                identity = title[len(prefix):].strip()
                if identity:
                  active.add(identity)

          # A failed prepare job needs no lock recovery. Give that series
          # a short cooldown so a bad source cannot consume a worker slot forever.
          result = subprocess.run(
            ["gh", "api", f"repos/{repo}/actions/workflows/prepare-one-episode.yml/runs?status=completed&per_page=100"],
            check=True, capture_output=True, text=True,
          )
          for run in json.loads(result.stdout).get("workflow_runs", []):
            if run.get("conclusion") not in {"failure", "timed_out"}:
              continue
            title = str(run.get("display_title") or "")
            if not title.startswith(prefix):
              continue
            identity = title[len(prefix):].strip()
            raw_updated = str(run.get("updated_at") or "")
            try:
              updated = datetime.fromisoformat(raw_updated.replace("Z", "+00:00"))
            except ValueError:
              continue
            age = now - updated.astimezone(timezone.utc)
            if identity and timedelta(0) <= age <= cooldown:
              recent_failed.add(identity)

          completed_identity = os.environ.get("COMPLETED_IDENTITY", "").strip()
          completed_conclusion = os.environ.get("COMPLETED_CONCLUSION", "").strip().lower()
          if completed_identity:
            active.discard(completed_identity)
            print(f"Releasing one worker slot for completed identity {completed_identity}.")
            if completed_conclusion in {"failure", "timed_out"}:
              recent_failed.add(completed_identity)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
            output.write("ANIMEHIGHBO_ACTIVE_IDENTITIES=" + json.dumps(sorted(active)) + "\n")
            output.write("ANIMEHIGHBO_RECENT_FAILED_IDENTITIES=" + json.dumps(sorted(recent_failed)) + "\n")
          print(
            f"Found {len(active)} active worker(s) and {len(recent_failed)} recently failed episode(s); "
            f"recently failing series are backed off for {int(cooldown.total_seconds() // 60)} minutes."
          )
          PY
      - name: Plan the next single episode publication
        id: plan
        run: python tools/episode_queue.py --github-output "$GITHUB_OUTPUT"
      - name: Report planned independent workers
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: |
          python - <<'PY'
          import json, os
          entries = json.loads(os.environ["MATRIX"]).get("include", [])
          print(f"Planned independent episode workers: {len(entries)} (maximum 5)")
          for entry in entries:
              print(f"- {entry.get('title')} [{entry.get('identity')}]")
          PY

  episodes:
    name: Dispatch worker for ${{ matrix.title }}
    needs: queue
    if: needs.queue.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.queue.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Dispatch an independent episode workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDENTITY: ${{ matrix.identity }}
          SERIES_KEY: ${{ matrix.series_key }}
          TITLE: ${{ matrix.title }}
        run: |
          gh workflow run prepare-one-episode.yml --ref main \
            --field "identity=$IDENTITY" \
            --field "series_key=$SERIES_KEY" \
            --field "title=$TITLE"
          echo "Dispatched independent worker for $TITLE [$IDENTITY]"
