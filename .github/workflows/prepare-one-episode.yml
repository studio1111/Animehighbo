name: Animehighbo single-episode worker

on:
  workflow_call:
    inputs:
      identity:
        description: Stable identity of the one episode to process
        required: true
        type: string
      series_key:
        description: Normalized series and season key
        required: true
        type: string
      title:
        description: Human-readable source title
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    name: Prepare one episode and all three qualities
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg fonts-noto-core
      - name: Validate episode identity
        env:
          EPISODE_ID: ${{ inputs.identity }}
          SERIES_KEY: ${{ inputs.series_key }}
        run: |
          test -n "$EPISODE_ID" || { echo "Missing episode identity"; exit 1; }
          test -n "$SERIES_KEY" || { echo "Missing series key"; exit 1; }
      - name: Require the configured Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is required; no offline or alternate-key fallback is enabled."
            exit 1
          fi
      - name: Prepare this episode and validate all three qualities
        env:
          ANIMEHIGHBO_EPISODE_ID: ${{ inputs.identity }}
          ANIMEHIGHBO_SERIES_KEY: ${{ inputs.series_key }}
          ANIMEHIGHBO_PREPARE_ONLY: 'true'
          ANIMEHIGHBO_DRY_RUN: 'false'
          ANIMEHIGHBO_MAX_FILE_SIZE_MB: ${{ secrets.ANIMEHIGHBO_MAX_FILE_SIZE_MB || vars.ANIMEHIGHBO_MAX_FILE_SIZE_MB || '1800' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ (vars.GEMINI_MODEL == 'gemini-3.5-flash-lite' || vars.GEMINI_MODEL == 'gemini-3.6-flash') && 'gemini-3.1-flash-lite' || vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: python app.py
      - name: Upload this episode bundle
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ inputs.identity }}
          path: prepared/${{ inputs.identity }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish this completed episode to Telegram
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: animehighbo-publisher-${{ inputs.identity }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Download only this episode's artifact
        uses: actions/download-artifact@v4
        with:
          name: episode-${{ inputs.identity }}
          path: prepared-artifacts/episode-${{ inputs.identity }}
      - name: Install media tools for poster and file validation
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Configure Telegram API endpoint
        env:
          TELEGRAM_LOCAL_API_SECRET: ${{ secrets.TELEGRAM_LOCAL_API }}
          TELEGRAM_LOCAL_API_VAR: ${{ vars.TELEGRAM_LOCAL_API }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_BASE_URL: ${{ vars.TELEGRAM_API_BASE_URL }}
        run: |
          if [ -n "$TELEGRAM_LOCAL_API_SECRET" ]; then
            TELEGRAM_LOCAL_API="$TELEGRAM_LOCAL_API_SECRET"
          elif [ -n "$TELEGRAM_LOCAL_API_VAR" ]; then
            TELEGRAM_LOCAL_API="$TELEGRAM_LOCAL_API_VAR"
          else
            TELEGRAM_LOCAL_API="false"
          fi
          if [ "${TELEGRAM_LOCAL_API,,}" = "true" ]; then
            if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
              echo "TELEGRAM_LOCAL_API=true requires TELEGRAM_API_ID, TELEGRAM_API_HASH, and TELEGRAM_BOT_TOKEN secrets."
              exit 1
            fi
            docker run --pull always --detach --name animehighbo-local-bot-api \
              --publish 127.0.0.1:8081:8081 \
              --env TELEGRAM_API_ID="$TELEGRAM_API_ID" \
              --env TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
              --env TELEGRAM_LOCAL=1 \
              aiogram/telegram-bot-api:latest
            ready=false
            for attempt in $(seq 1 60); do
              if curl --silent --show-error --fail "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/getMe" >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != "true" ]; then
              docker logs animehighbo-local-bot-api || true
              echo "Local Telegram Bot API did not become ready."
              exit 1
            fi
            echo "TELEGRAM_API_BASE_URL=http://127.0.0.1:8081" >> "$GITHUB_ENV"
          elif [ -n "$TELEGRAM_API_BASE_URL" ]; then
            echo "TELEGRAM_API_BASE_URL=$TELEGRAM_API_BASE_URL" >> "$GITHUB_ENV"
          fi
      - name: Acquire global Telegram publisher lock
        id: acquire_lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANIMEHIGHBO_EPISODE_ID: ${{ inputs.identity }}
        run: python tools/publisher_lock.py acquire --identity "$ANIMEHIGHBO_EPISODE_ID"
      - name: Refresh publication state after acquiring the global lock
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Publish the episode poster and three reply videos
        env:
          ANIMEHIGHBO_PUBLISH_PREPARED: 'true'
          ANIMEHIGHBO_PREPARED_DIR: prepared-artifacts
          ANIMEHIGHBO_PUBLISH_EVENTS_FILE: publish-events.json
          ANIMEHIGHBO_DRY_RUN_SECRET: ${{ secrets.ANIMEHIGHBO_DRY_RUN }}
          ANIMEHIGHBO_DRY_RUN_VAR: ${{ vars.ANIMEHIGHBO_DRY_RUN }}
          ANIMEHIGHBO_MAX_FILE_SIZE_MB_SECRET: ${{ secrets.ANIMEHIGHBO_MAX_FILE_SIZE_MB }}
          ANIMEHIGHBO_MAX_FILE_SIZE_MB_VAR: ${{ vars.ANIMEHIGHBO_MAX_FILE_SIZE_MB }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$ANIMEHIGHBO_DRY_RUN_SECRET" ]; then
            export ANIMEHIGHBO_DRY_RUN="$ANIMEHIGHBO_DRY_RUN_SECRET"
            dry_run_source="repository secret"
          elif [ -n "$ANIMEHIGHBO_DRY_RUN_VAR" ]; then
            export ANIMEHIGHBO_DRY_RUN="$ANIMEHIGHBO_DRY_RUN_VAR"
            dry_run_source="repository variable"
          else
            export ANIMEHIGHBO_DRY_RUN="$(python -c 'import json; print(str(json.load(open("config.json", encoding="utf-8")).get("dry_run", True)).lower())')"
            dry_run_source="config.json"
          fi
          echo "Publisher dry-run source: $dry_run_source"
          if [ -n "$ANIMEHIGHBO_MAX_FILE_SIZE_MB_SECRET" ]; then
            export ANIMEHIGHBO_MAX_FILE_SIZE_MB="$ANIMEHIGHBO_MAX_FILE_SIZE_MB_SECRET"
          elif [ -n "$ANIMEHIGHBO_MAX_FILE_SIZE_MB_VAR" ]; then
            export ANIMEHIGHBO_MAX_FILE_SIZE_MB="$ANIMEHIGHBO_MAX_FILE_SIZE_MB_VAR"
          else
            export ANIMEHIGHBO_MAX_FILE_SIZE_MB=1800
          fi
          python app.py
      - name: Persist duplicate-prevention state without overwriting parallel workers
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/state.json)" ]; then
            cp data/state.json /tmp/animehighbo-local-state.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              git checkout -B state-update origin/main
              python - <<'PY'
          import json
          from pathlib import Path

          local_path = Path("/tmp/animehighbo-local-state.json")
          local = json.loads(local_path.read_text(encoding="utf-8"))
          state_path = Path("data/state.json")
          current = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
          for section in ("published", "posters", "seen"):
              current_section = current.setdefault(section, {})
              local_section = local.get(section, {})
              if not isinstance(current_section, dict) or not isinstance(local_section, dict):
                  raise SystemExit(f"Invalid state section: {section}")
              for key, value in local_section.items():
                  if key not in current_section:
                      current_section[key] = value
                      continue
                  if section == "published" and isinstance(value, dict):
                      existing = current_section[key]
                      required = {"1080p", "720p", "480p"}
                      local_complete = required.issubset(set(value.get("complete_qualities", [])))
                      existing_complete = (
                          isinstance(existing, dict)
                          and required.issubset(set(existing.get("complete_qualities", [])))
                      )
                      if local_complete and not existing_complete:
                          current_section[key] = value
          state_path.parent.mkdir(parents=True, exist_ok=True)
          state_path.write_text(
              json.dumps(current, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
              if git diff --quiet -- data/state.json; then
                echo "Publication state is already present on main."
                exit 0
              fi
              git add data/state.json
              git commit -m "chore: merge Animehighbo publication state [skip ci]"
              if git push origin HEAD:main; then
                echo "Publication state merged and persisted to main."
                exit 0
              fi
              echo "Push attempt $attempt raced with another worker; merging against the latest main."
            done
            echo "Could not persist publication state after five merge attempts."
            exit 1
          else
            echo "No publication state changes to persist."
          fi
      - name: Release global Telegram publisher lock
        if: always() && steps.acquire_lock.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANIMEHIGHBO_EPISODE_ID: ${{ inputs.identity }}
        run: python tools/publisher_lock.py release --identity "$ANIMEHIGHBO_EPISODE_ID"
