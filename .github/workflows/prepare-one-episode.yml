name: Animehighbo single-episode worker
run-name: Prepare episode ${{ github.event.client_payload.identity }}

on:
  repository_dispatch:
    types: [animehighbo-prepare-episode]

permissions:
  actions: write
  contents: read

concurrency:
  group: animehighbo-episode-${{ github.event.client_payload.identity }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare one episode and all three qualities
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg fonts-noto-core
      - name: Validate episode dispatch payload
        env:
          EPISODE_ID: ${{ github.event.client_payload.identity }}
          SERIES_KEY: ${{ github.event.client_payload.series_key }}
        run: |
          test -n "$EPISODE_ID" || { echo "Missing episode identity"; exit 1; }
          test -n "$SERIES_KEY" || { echo "Missing series key"; exit 1; }
      - name: Require the configured Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is required; no offline or alternate-key fallback is enabled."
            exit 1
          fi
      - name: Prepare one episode and all three validated qualities
        env:
          ANIMEHIGHBO_EPISODE_ID: ${{ github.event.client_payload.identity }}
          ANIMEHIGHBO_SERIES_KEY: ${{ github.event.client_payload.series_key }}
          ANIMEHIGHBO_PREPARE_ONLY: 'true'
          ANIMEHIGHBO_DRY_RUN: 'false'
          ANIMEHIGHBO_MAX_FILE_SIZE_MB: ${{ secrets.ANIMEHIGHBO_MAX_FILE_SIZE_MB || vars.ANIMEHIGHBO_MAX_FILE_SIZE_MB || '1800' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: python app.py
      - name: Upload this episode's prepared files
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.event.client_payload.identity }}
          path: prepared/${{ github.event.client_payload.identity }}
          if-no-files-found: error
          retention-days: 7
      - name: Dispatch publisher for this completed episode
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_WORKFLOW_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'animehighbo-episode-prepared',
              client_payload: {
                run_id: context.runId,
                identity: '${{ github.event.client_payload.identity }}'
              }
            });
