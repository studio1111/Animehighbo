name: Animehighbo single-episode worker
run-name: Animehighbo worker ${{ inputs.identity }}

on:
  workflow_dispatch:
    inputs:
      identity:
        description: Stable identity of the one episode to process
        required: true
        type: string
      series_key:
        description: Normalized series and season key
        required: true
        type: string
      title:
        description: Human-readable source title
        required: true
        type: string
  workflow_call:
    inputs:
      identity:
        description: Stable identity of the one episode to process
        required: true
        type: string
      series_key:
        description: Normalized series and season key
        required: true
        type: string
      title:
        description: Human-readable source title
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  prepare:
    name: Prepare one episode and all three qualities
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install media tools with bounded package setup
        timeout-minutes: 15
        run: |
          # ffmpeg plus its codec libraries can exceed two minutes on hosted-runner
          # mirrors, especially across five concurrent workers. Bound the operation
          # generously enough for the full package set and retry transient mirror errors.
          # Hosted runners can contain an optional Microsoft package feed that returns
          # 403 and aborts apt-get update even though this job does not use that feed.
          for source_file in /etc/apt/sources.list.d/*; do
            if [ -f "$source_file" ] && grep -q "packages.microsoft.com" "$source_file"; then
              echo "Disabling unrelated Microsoft apt source for this ephemeral runner: $source_file"
              sudo mv "$source_file" "$source_file.disabled"
            fi
          done
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo timeout 300 apt-get -o Acquire::Retries=3 update
          installed=false
          for attempt in 1 2 3; do
            if sudo timeout 600 apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg aria2 fonts-noto-core; then
              installed=true
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Media package installation failed after three attempts."
              exit 1
            fi
            echo "Media package installation attempt $attempt failed; retrying in 10 seconds."
            sleep 10
            sudo timeout 300 apt-get -o Acquire::Retries=3 update
          done
          test "$installed" = true
          command -v ffmpeg
          command -v aria2c
          ffmpeg -version | head -n 1
          aria2c --version | head -n 1
      - name: Validate episode identity
        env:
          EPISODE_ID: ${{ inputs.identity }}
          SERIES_KEY: ${{ inputs.series_key }}
        run: |
          test -n "$EPISODE_ID" || { echo "Missing episode identity"; exit 1; }
          test -n "$SERIES_KEY" || { echo "Missing series key"; exit 1; }
      - name: Install offline subtitle translator fallback
        run: pip install -r requirements-subtitles.txt
      - name: Confirm translation fallback is available
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Gemini is not configured; the local Argos English-to-Persian translator will be used."
          else
            echo "Gemini is configured; local Argos translation is available as a fallback."
          fi
      - name: Prepare this episode and validate all three qualities
        env:
          ANIMEHIGHBO_EPISODE_ID: ${{ inputs.identity }}
          ANIMEHIGHBO_SERIES_KEY: ${{ inputs.series_key }}
          ANIMEHIGHBO_PREPARE_ONLY: 'true'
          ANIMEHIGHBO_PERSIAN_SUBTITLE_FONT_SIZE: '92'
          ANIMEHIGHBO_DRY_RUN: 'false'
          ANIMEHIGHBO_MAX_FILE_SIZE_MB: ${{ secrets.ANIMEHIGHBO_MAX_FILE_SIZE_MB || vars.ANIMEHIGHBO_MAX_FILE_SIZE_MB || '1800' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ (vars.GEMINI_MODEL == 'gemini-3.5-flash-lite' || vars.GEMINI_MODEL == 'gemini-3.6-flash') && 'gemini-3.1-flash-lite' || vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: python app.py
      - name: Upload this episode bundle
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ inputs.identity }}
          path: prepared/${{ inputs.identity }}
          if-no-files-found: error
          retention-days: 7
      - name: Refill episode preparation slots
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EPISODE_ID: ${{ inputs.identity }}
          OUTCOME: ${{ job.status }}
        run: |
          gh workflow run publish-prepared-queue.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "Publisher queue dispatch failed; the scheduled queue will retry."
          gh workflow run prepare-episodes.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --field "completed_identity=$EPISODE_ID" \
            --field "completed_conclusion=$OUTCOME" \
            || echo "Preparation refill dispatch failed; the scheduled dispatcher will retry."

