name: Refresh anime poster and metadata cache

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'tools/refresh_anime_metadata.py'
      - '.github/workflows/refresh-anime-metadata.yml'
  schedule:
    - cron: '23 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime-metadata-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Refresh verified poster and synopsis metadata
        env:
          ANIMEHIGHBO_POSTER_CACHE: data/anime_poster_state.json
        run: python tools/refresh_anime_metadata.py
      - name: Commit metadata improvements
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- data/anime_poster_state.json)" ]; then
            echo "Metadata cache is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anime_poster_state.json
          git commit -m "data: refresh anime poster metadata and synopses"
          git fetch origin main
          git rebase origin/main
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main
