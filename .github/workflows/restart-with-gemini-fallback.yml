name: Restart Animehighbot with Gemini fallback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restart-with-gemini-fallback.yml'
permissions:
  actions: write
  contents: read
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the dispatcher pinned before the 503 fallback fix
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 39599027049;
            const expectedSha = "3325c2148f35292ea21630dcb480ca0622176f1b";
            const result = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            const run = result.data;
            core.info(`Verified run ${run.id}: ${run.name}, status=${run.status}, SHA=${run.head_sha}`);
            if (run.name !== "Animehighbo episode dispatcher" || run.head_sha !== expectedSha) {
              core.setFailed("Run identity mismatch; refusing cancellation.");
              return;
            }
            if (["queued", "in_progress", "pending", "waiting"].includes(run.status)) {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId
              });
              core.info("Cancellation requested; corrected dispatcher will retry with same-key Gemini fallback.");
            } else {
              core.info("Old dispatcher already terminal; no cancellation needed.");
            }
