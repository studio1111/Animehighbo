name: Sync RSS input to config

on:
  push:
    branches: [main]
    paths:
      - "RSS input.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animehighbo-rss-config-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate RSS input and update config.json
        run: python tools/sync_rss_input.py
      - name: Commit config.json if changed
        run: |
          if git diff --quiet -- config.json; then
            echo "config.json already matches RSS input."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          git commit -m "chore: sync RSS input into config.json [skip ci]"
          git push
