name: Restart Animehighbot with supported Gemini fallback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restart-supported-gemini.yml'
permissions:
  actions: write
  contents: read
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify and cancel the dispatcher using the unavailable fallback model
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 39602945179;
            const expectedSha = "81680613f6ccdb12421d583941400b3e724c0a2e";
            const result = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            const run = result.data;
            core.info(`Verified run ${run.id}: ${run.name}, status=${run.status}, SHA=${run.head_sha}`);
            if (run.name !== "Animehighbo episode dispatcher" || run.head_sha !== expectedSha) {
              core.setFailed("Run identity mismatch; refusing cancellation.");
              return;
            }
            if (["queued", "in_progress", "pending", "waiting"].includes(run.status)) {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId
              });
              core.info("Cancellation requested so the next run uses the supported fallback model.");
            } else {
              core.info("Run already terminal; no cancellation needed.");
            }
