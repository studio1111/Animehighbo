name: Refresh existing channel posters and anime summaries

on:
  push:
    branches: [main]
    paths:
      - 'tools/backfill_channel_posters.py'
      - '.github/workflows/backfill-channel-posters.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animehighbo-channel-poster-backfill
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Refresh poster images and captions on existing episode anchors
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_LOCAL_API: ${{ secrets.TELEGRAM_LOCAL_API }}
          TELEGRAM_API_BASE_URL: ${{ vars.TELEGRAM_API_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANIMEHIGHBO_STATE_FILE: data/state.json
          ANIMEHIGHBO_POSTER_CACHE: data/anime_poster_state.json
        run: python tools/backfill_channel_posters.py
