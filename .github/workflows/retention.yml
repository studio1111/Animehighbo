name: Retain latest 30 workflow runs
# Apply the repository-wide 30-run cap immediately after changes, then daily.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retention.yml'
  schedule:
    - cron: '43 4 * * *'
  # Omit the workflows filter so every workflow completion triggers cleanup.
  workflow_run:
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: animehighbo-run-retention
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Retain latest 30 workflow runs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete runs older than the latest 30
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );
            const completed = runs
              .filter(run => run.status === "completed")
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const obsolete = completed.slice(30);
            core.info(`Found ${runs.length} total runs and ${completed.length} completed runs; keeping ${Math.min(30, completed.length)} completed runs and deleting ${obsolete.length}. Active runs are never deleted.`);
            for (const run of obsolete) {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              core.info(`Deleted run ${run.id} (${run.name}, ${run.created_at}).`);
            }
